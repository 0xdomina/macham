<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macham — film</title>
<style>
/* Tokens copied verbatim from src/widget/assistant.ts:39-68 (assistantCss) —
   the product's own monochrome system. The marketing site's Archivo/paper/lime
   palette is a different visual system and is deliberately not used here. */
:root{
  --ink:#0A0A0A; --paper:#ffffff; --wash:#F5F5F5; --line:#E5E5E5; --mute:#6B6B6B;
  --sub:#A8A8A8; --tiny:#7E7E7E;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}

/* Ground: the launcher's own black, fielded with the widget's hairline grey. */
#ground{position:fixed;inset:0;background:var(--ink)}
#field{position:fixed;inset:0;opacity:.05;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px}

/* Product window. Radius and shadow lifted from the widget panel itself. */
#frame{position:fixed;left:844px;top:110px;width:1040px;height:860px;
  border:1px solid rgba(229,229,229,.20);border-radius:14px;overflow:hidden;
  background:var(--paper);box-shadow:0 8px 32px rgb(0 0 0 / 0.16)}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#app{width:1000px;height:827px;border:0;display:block;background:var(--paper)}

/* Caption rail — the widget's type scale, at film size. */
#type{position:fixed;left:96px;top:0;width:680px;height:1080px}
.cap{position:absolute;left:0;width:680px;color:#fff;font-weight:700;font-size:52px;line-height:1.12;letter-spacing:-.02em}
.cap.sub{font-weight:400;font-size:33px;line-height:1.28;color:var(--sub);letter-spacing:0}
.cap.mark{font-weight:700;font-size:120px;letter-spacing:-.045em;color:#fff}
.cap.accent{color:var(--wash)}
.cap.tiny{font-family:var(--mono);font-weight:400;font-size:19px;letter-spacing:.01em;color:var(--tiny)}

#cursor{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;z-index:40;opacity:0}
#cursor .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;transform:scale(.2);opacity:0}
#cursor .tip{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:2px solid #fff}

/* Signature transition: the widget's own wash grey, sweeping the full frame. */
#band{position:fixed;top:0;bottom:0;width:34%;left:0;background:var(--wash);transform:translateX(-110%);z-index:50}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:30;
  background:radial-gradient(135% 105% at 38% 50%,transparent 55%,rgba(0,0,0,.34) 100%)}
</style>
</head>
<body>
<div id="ground"></div>
<div id="field"></div>
<div id="frame"><div id="cam"><iframe id="app" tabindex="-1"></iframe></div></div>
<div id="type"></div>
<div id="cursor"><span class="ring"></span><span class="tip"></span></div>
<div id="vignette"></div>
<div id="band"></div>

<script type="module">
import { SCRIPT, FILM, EPOCH_MS } from "./fixtures.mjs";

const W = 1920, H = 1080;
// The product window is not a fixed rect: it hugs whatever the scene frames, so
// there is never dead space inside it. It is anchored to the right edge of the
// composition band and centred vertically, and never grows past REGION.
const REGION = { right: 1868, cy: 540, maxW: 1040, maxH: 888 };
const WIN = { x: 844, y: 110, w: 1040, h: 860 };   // nominal, for reference only
const IW = 1000, IH = 827;                          // iframe css viewport = storefront
const APP_IN = 4.8;                                 // film time the product appears
const TOTAL = 52.8;                                 // 88 beats on a 0.6s grid (100 BPM)

const frame = document.getElementById("frame");
const cam = document.getElementById("cam");
const appEl = document.getElementById("app");
const typeEl = document.getElementById("type");
const curEl = document.getElementById("cursor");
const ringEl = curEl.querySelector(".ring");
const bandEl = document.getElementById("band");

// ---- easing: three shared helpers, nothing else ------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lin = (t, a, b) => (b <= a ? 1 : clamp((t - a) / (b - a), 0, 1));
const out = (p) => 1 - Math.pow(1 - p, 3);
const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

// ---- scenes: one claim each, boundaries on the 0.6s beat grid ----------
// box = a crop of the storefront in iframe css px; anchor = measure the live DOM.
// The camera always contain-fits the subject, so nothing of the widget is ever
// cropped; `fit` below 1 just lets more of the host page in around it.
const PAGE = { x: 0, y: 0, w: IW, h: IH };
// The panel's neighbourhood: from the host shell's content seam (x=200) to the
// right edge, tall enough to hold the whole 400x620 panel. The establishing shot
// and the panel shots therefore share almost the same window size — the camera
// moves by reframing inside a stable window instead of resizing on every cut.
const PANEL_SPOT = { x: 200, y: 100, w: 800, h: 660 };
const SCENES = [
  { n: "ColdOpen",   at: 0.0,  d: 4.8,  show: false },
  { n: "HostShell",  at: 4.8,  d: 8.4,  show: true, box: PAGE, fit: 1.0, push: [1, 1.015] },
  { n: "Launcher",   at: 13.2, d: 3.6,  show: true, box: { x: 470, y: 211, w: 530, h: 616 }, fit: 0.97, push: [1, 1.05] },
  { n: "TheAsk",     at: 16.8, d: 4.2,  show: true, box: PANEL_SPOT, fit: 0.98 },
  { n: "TheCards",   at: 21.0, d: 12.0, show: true, anchor: ".mcm-grid", up: 122, fullWidth: true, fit: 0.99, push: [1, 1.07] },
  { n: "ThePropose", at: 33.0, d: 8.4,  show: true, anchor: ".mcm-approve", up: 96, fullWidth: true, fit: 0.97, push: [1, 1.05] },
  { n: "TheHandoff", at: 41.4, d: 4.8,  show: true, box: PANEL_SPOT, fit: 0.98 },
  { n: "TheStamp",   at: 46.2, d: 6.6,  show: false },
];
const sceneAt = (t) => SCENES.reduce((acc, s) => (t >= s.at ? s : acc), SCENES[0]);

// ---- captions: the product's own words, on the beat grid ----------------
const CAPS = [
  { t: -0.2, d: 4.4, x: "A storefront has no buyer agent.", cls: "mark", y: -230 },
  { t: 2.4,  d: 2.4, x: "Macham puts one on any store.", cls: "mark accent", y: 214 },
  { t: 5.4,  d: 3.0, x: "One script tag. One init call.", y: -132 },
  { t: 8.6,  d: 4.0, x: "Macham.init({ apiKey, tenantId }) — the tag alone does nothing.", cls: "sub", y: -58 },
  { t: 13.6, d: 2.6, x: "A publishable key.", y: -132 },
  { t: 16.0, d: 3.2, x: "Safe to expose in a storefront. Not a secret.", cls: "sub", y: -58 },
  { t: 17.6, d: 2.6, x: "Ask in plain words.", y: -132 },
  { t: 20.4, d: 1.1, x: "> " + FILM.ask, cls: "tiny", y: 96 },
  { t: 21.6, d: 3.4, x: "It reads the store's catalogue, not a model's memory.", y: -170 },
  { t: 25.4, d: 4.2, x: "Two rows. Two real prices. No invented product.", cls: "sub", y: 60 },
  { t: 30.0, d: 2.6, x: "Written by Macham's gateway, then frozen.", cls: "sub", y: 60 },
  { t: 33.6, d: 3.0, x: "The agent proposes.", y: -150 },
  { t: 37.0, d: 4.0, x: "Add 1 × Harbor Parka to your bag?", cls: "sub", y: 60 },
  { t: 42.0, d: 3.2, x: "The bag is the store's to change.", y: -150 },
  { t: 45.4, d: 1.3, x: "Done.", cls: "sub", y: 60 },
  { t: 46.8, d: 6.0, x: "Macham", cls: "mark", y: -190 },
  { t: 48.6, d: 4.2, x: "Any store in, assistance out.", cls: "sub", y: -40 },
  { t: 50.8, d: 2.0, x: "Narration captured live from Macham's own gateway.", cls: "tiny", y: 40 },
];
const capNodes = new Map();
for (const c of CAPS) {
  const el = document.createElement("div");
  el.className = "cap" + (c.cls ? " " + c.cls : "");
  el.textContent = c.x;
  typeEl.appendChild(el);
  capNodes.set(c, el);
}

// ---- the performance: real product DOM, driven by the film clock -------
// Clicks are applied once, in order, with the widget's virtual clock advanced to
// each beat; typed text is a pure function of film time.
const TYPES = [
  // `until` is the beat of the click that consumes the field: the text must still
  // be complete in the box when Send reads it, and must NOT be repainted after the
  // widget clears the input itself (src/widget/assistant.ts:217).
  { at: 18.00, until: 20.40, sel: ".mcm-bar input", text: FILM.ask, per: 0.075 },
];
const CLICKS = [
  { at: 17.40, sel: ".mcm-launcher" },
  { at: 20.40, sel: ".mcm-bar button" },
  { at: 33.60, sel: ".mcm-grid .mcm-card:first-child .acts button" },
  { at: 42.00, sel: ".mcm-approve button.yes", wait: ".mcm-approve button.yes" },
];
const POINTS = [
  { at: 13.60, sel: ".mcm-launcher" },
  { at: 17.30, sel: ".mcm-launcher" },
  { at: 17.90, sel: ".mcm-bar input" },
  { at: 20.35, sel: ".mcm-bar button" },
  { at: 33.50, sel: ".mcm-grid .mcm-card:first-child .acts button" },
  { at: 41.90, sel: ".mcm-approve button.yes" },
];

const win = () => (window.top || window);
let loaded = false, loading = null, applied = -1, lastT = -1, reloads = 0;
let cam2 = { k: 1, tx: 0, ty: 0 };
const HOME = { x: WIN.x - 120, y: WIN.y + WIN.h - 60 };

function buildSeq() {
  // assist-1.json is the byte-for-byte gateway response; assist-1.request.json is
  // the request it answers, so vclock can refuse to show a frozen answer for a
  // prompt the buyer never typed.
  return Promise.all(SCRIPT.map((e) =>
    Promise.all([
      e.file ? win().__realFetch("/fixtures/" + e.file).then((r) => r.json()) : Promise.resolve(e.body),
      e.expect ? win().__realFetch("/fixtures/" + e.expect).then((r) => r.json()) : Promise.resolve(undefined),
    ]).then(([body, expect]) => ({ method: e.method, routes: e.routes, body, expect, delay: e.delay || 0 }))
  )).then((entries) => {
    win().__SEQ = entries;
  });
}

function mountApp() {
  if (loaded) return Promise.resolve();
  if (loading) return loading;
  win().__EPOCH = EPOCH_MS; // vclock pins Date to the capture run's epoch
  const token = "film=" + (++reloads);
  loading = new Promise((res) => {
    appEl.addEventListener("load", () => { loaded = true; loading = null; res(); }, { once: true });
    appEl.src = "/storefront.html?" + token;
  });
  return loading;
}

const iw = () => appEl.contentWindow;
const idoc = () => appEl.contentWindow.document;
const vt = (t) => Math.max(0, Math.round((t - APP_IN) * 1000));

// Response bodies resolve on real event-loop turns, not microtasks: drain enough
// of them that a click's whole async chain has landed before the next beat.
const drain = async (w, turns) => {
  for (let k = 0; k < turns; k++) await new Promise((r) => w.__realSetTimeout(r, 0));
};

async function applyUpTo(t) {
  const w = iw();
  const setTypes = (tt) => {
    for (const ty of TYPES) {
      const end = ty.at + ty.text.length * ty.per;
      if (tt < ty.at || tt > (ty.until == null ? end : ty.until)) continue;
      const el = idoc().querySelector(ty.sel);
      if (!el) continue;
      el.value = ty.text.slice(0, tt >= end ? ty.text.length : clamp(Math.floor((tt - ty.at) / ty.per), 0, ty.text.length));
    }
  };
  const report = (window.__clickReport = window.__clickReport || []);
  for (let i = applied + 1; i < CLICKS.length; i++) {
    if (CLICKS[i].at > t) break;
    const c = CLICKS[i];
    w.__advanceTo(vt(c.at));
    await drain(w, 40); // land the previous beat's async work before this one reads the DOM
    for (let k = 0; c.wait && k < 14; k++) {
      if (idoc().querySelector(c.wait)) break;
      w.__advanceTo(w.__V.t + 100);
      await drain(w, 20);
    }
    setTypes(c.at); // the field must hold its value before the click reads it
    const el = idoc().querySelector(c.sel);
    if (el) el.click();
    report.push({ at: c.at, sel: c.sel, ok: Boolean(el), vt: (w.__V.t / 1000).toFixed(2) });
    applied = i;
    await drain(w, 40);
  }
  w.__advanceTo(vt(t));
  setTypes(t);
  await drain(w, 6);
}

async function reset() {
  loaded = false; loading = null; applied = -1;
  const w = iw();
  if (w && w.__resetSeq) w.__resetSeq();
  window.__clickReport = [];
  appEl.removeAttribute("src");
  await mountApp();
}

// ---- camera ------------------------------------------------------------
// The window hugs its subject: the frame rect is the focus box scaled to fit the
// band, so there is no dead space inside it and nothing of the widget is cropped.
// The box is measured from the live product DOM every frame, and eased across a
// scene boundary so the reframing reads as one camera move, not a jump cut.
function boxFor(s, doc) {
  if (!s.show) return null;
  if (s.anchor) {
    const el = doc.querySelector(s.anchor);
    if (el) {
      const r = el.getBoundingClientRect();
      if (r.width && r.height) {
        const padX = s.pad == null ? 16 : s.pad;
        const up = s.up || 0;
        // A content-height crop at the panel's own width: the slice never cuts a
        // card or a bubble sideways, and no strip of host page is dragged in beside it.
        const panel = s.fullWidth && doc.querySelector(".mcm-panel");
        const pr = panel ? panel.getBoundingClientRect() : null;
        const x = pr ? pr.left - 6 : clamp(r.left - padX, 0, IW);
        const w = pr ? pr.width + 12 : clamp(r.width + padX * 2, 1, IW - x);
        const y = clamp(r.top - up, 0, IH);
        return { x, y, w, h: clamp(r.bottom - y + 14, 1, IH - y) };
      }
    }
  }
  return s.box || null;
}

function lerpBox(a, b, g) {
  if (!a) return b;
  if (!b) return a;
  return {
    x: a.x + (b.x - a.x) * g,
    y: a.y + (b.y - a.y) * g,
    w: a.w + (b.w - a.w) * g,
    h: a.h + (b.h - a.h) * g,
  };
}

function focusBox(s, t, doc) {
  const i = SCENES.indexOf(s);
  const cur = boxFor(s, doc);
  const prev = i > 0 ? boxFor(SCENES[i - 1], doc) : null;
  const box = lerpBox(prev, cur, out(lin(t, s.at, s.at + 0.36)));
  if (!box) return PAGE;
  const p = lin(t, s.at, s.at + s.d);
  const push = s.push ? s.push[0] + (s.push[1] - s.push[0]) * out(p) : 1;
  if (push === 1) return box;
  const g = 1 / push; // ease the crop in around the box centre
  return { x: box.x + box.w * (1 - g) / 2, y: box.y + box.h * (1 - g) / 2, w: box.w * g, h: box.h * g };
}

// ---- pure render of everything except the product DOM ------------------
function paint(t) {
  const s = sceneAt(t);
  const on = s.show && t >= APP_IN;
  // Two wipes, one signature: the product enters from below and leaves upward.
  const reveal = out(lin(t, APP_IN, APP_IN + 0.35));
  const exit = 1 - out(lin(t, 45.9, 46.25));
  frame.style.clipPath = `inset(${((1 - exit) * 100).toFixed(1)}% 0 ${((1 - reveal) * 100).toFixed(1)}% 0)`;
  if (on) {
    const doc = idoc();
    const box = focusBox(s, t, doc);
    const k = clamp(Math.min(REGION.maxW / box.w, REGION.maxH / box.h) * (s.fit || 1), 0.4, 6);
    const fw = Math.min(REGION.maxW, box.w * k), fh = Math.min(REGION.maxH, box.h * k);
    const fx = REGION.right - fw, fy = REGION.cy - fh / 2;
    frame.style.left = Math.round(fx) + "px";
    frame.style.top = Math.round(fy) + "px";
    frame.style.width = Math.round(fw) + "px";
    frame.style.height = Math.round(fh) + "px";
    cam2 = { k, fx, fy, fw, fh, box };
    cam.style.transform =
      `translate(${(-box.x * k).toFixed(2)}px,${(-box.y * k).toFixed(2)}px) scale(${k.toFixed(4)})`;
  }

  for (const c of CAPS) {
    const el = capNodes.get(c);
    const live = t >= c.t && t < c.t + c.d;
    el.style.top = ((H / 2) + (c.y || 0) - 30) + "px";
    if (!live) { el.style.clipPath = "inset(0 0 100% 0)"; el.style.transform = "translateY(12px)"; continue; }
    const r = out(lin(t, c.t, c.t + 0.18));
    el.style.clipPath = `inset(${((1 - r) * 100).toFixed(1)}% 0 0 0)`;
    el.style.transform = `translateY(${((1 - r) * 12).toFixed(1)}px)`;
  }

  // cursor: enter, decelerate onto the next target, press, rest there
  let dest = null, rest = null;
  for (const q of POINTS) { if (q.at <= t) rest = q; else if (!dest) dest = q; }
  const pt = dest && t > dest.at - 0.6 ? dest : rest;
  const vis = Boolean(on && pt && t > APP_IN + 0.4 && t < 45.6);
  const posOf = (sel) => {
    const el = idoc().querySelector(sel);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return null; // not on screen now; do not park on it
    // iframe css px -> film px through the frame rect and the cam transform
    const b = cam2.box || { x: 0, y: 0 };
    return {
      x: cam2.fx + (r.left + r.width / 2 - b.x) * cam2.k,
      y: cam2.fy + (r.top + r.height / 2 - b.y) * cam2.k,
    };
  };
  const to = vis && pt ? posOf(pt.sel) : null;
  curEl.style.opacity = to ? "1" : "0";
  if (to) {
    const from = rest && rest !== pt ? posOf(rest.sel) || curEl._pos || HOME : curEl._pos || HOME;
    const gp = pt === dest ? out(lin(t, dest.at - 0.6, dest.at - 0.02)) : 1;
    const x = from.x + (to.x - from.x) * gp;
    const y = from.y + (to.y - from.y) * gp;
    curEl.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    curEl._pos = { x, y };
    const press = lin(t, pt.at, pt.at + 0.2);
    ringEl.style.opacity = t >= pt.at && t < pt.at + 0.2 ? String((1 - press).toFixed(2)) : "0";
    ringEl.style.transform = `scale(${(0.2 + press * 1.5).toFixed(2)})`;
  }

  // signature band: into the product and out of it, on the beat
  const bands = [[4.5, 5.1], [45.6, 46.2]];
  let bx = -110;
  for (const [a, b] of bands) {
    if (t >= a && t < b) bx = -110 + inOut(lin(t, a, b)) * 230;
    else if (t >= b) bx = 130;
  }
  bandEl.style.transform = `translateX(${bx.toFixed(1)}%)`;
  bandEl.style.opacity = bx > -108 && bx < 128 ? "1" : "0";
}

// ---- seek contract -----------------------------------------------------
window.__filmSeek = async (t) => {
  t = clamp(t, 0, TOTAL);
  if (t < lastT - 1e-6) { await reset(); lastT = -1; }
  if (!loaded) await mountApp();
  if (t >= APP_IN) await applyUpTo(t);
  const w = iw();
  if (w && w.__pinScroll) w.__pinScroll();
  paint(t);
  if (w && w.__V) w.__V.t = vt(t);
  lastT = t;
  return {
    t,
    scene: sceneAt(t).n,
    cam: {
      k: +cam2.k.toFixed(3),
      frame: cam2.fw ? [Math.round(cam2.fx), Math.round(cam2.fy), Math.round(cam2.fw), Math.round(cam2.fh)] : null,
      box: cam2.box ? [Math.round(cam2.box.x), Math.round(cam2.box.y), Math.round(cam2.box.w), Math.round(cam2.box.h)] : null,
    },
    seq: w && w.__seqCursor ? w.__seqCursor() : -1,
    log: w && w.__seqLog ? w.__seqLog() : [],
    dom: w ? domProbe(w) : null,
  };
};

// What the smoke test reads back, so "it looks right" can be checked in pixels
// and in text at the same time.
function domProbe(w) {
  const doc = w.document;
  const txt = (sel) => { const e = doc.querySelector(sel); return e ? e.textContent.trim().slice(0, 140) : null; };
  const n = (sel) => doc.querySelectorAll(sel).length;
  return {
    open: doc.querySelector(".mcm-panel") ? !doc.querySelector(".mcm-panel").hidden : null,
    messages: [...doc.querySelectorAll(".mcm-msg")].map((m) => m.className.replace("mcm-msg mcm-", "") + ": " + m.textContent.trim().slice(0, 90)),
    cards: [...doc.querySelectorAll(".mcm-card")].map((c) => (c.querySelector(".title")?.textContent || "") + " | " + (c.querySelector(".price")?.textContent || "") + " | thumb=" + (c.querySelector(".thumb.ph") ? "ph" : (c.querySelector("img") ? "img" : "none"))),
    approve: txt(".mcm-approve"),
    proposal: w.__proposal || null,
    gridCount: n(".mcm-grid"),
  };
}

// the product's own CSS animations run on the film clock, not wall clock
const anims = () => {
  const t = lastT * 1000;
  for (const f of [window, iw()]) {
    try { for (const a of f.document.getAnimations()) { a.currentTime = t; } } catch {}
  }
};
const _seek = window.__filmSeek;
window.__filmSeek = async (t) => { const r = await _seek(t); anims(); return r; };

await buildSeq();
if (window.__NO_CAPTIONS) typeEl.style.display = "none"; // clean plate pass
paint(0);
window.__FILM_READY = true;
</script>
</body>
</html>
