<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Macham settings</title>
    <style>
      :root { color-scheme: light; }
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #fafafa; color: #0a0a0a; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.lead { color: #6b6b6b; margin: 0 0 24px; }
      label { display: block; margin: 16px 0 6px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 10px; font: inherit; }
      .hint { color: #6b6b6b; font-weight: 400; font-size: 12px; margin-top: 4px; }
      button { margin-top: 20px; border: 0; background: #0a0a0a; color: #fff; padding: 10px 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
      button.ghost { background: #fff; color: #0a0a0a; border: 1px solid #e5e5e5; margin-left: 8px; }
      #status { margin-top: 14px; font-size: 13px; min-height: 18px; }
      #status.ok { color: #0a7a35; } #status.bad { color: #b00020; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Macham on any store</h1>
      <p class="lead">Configure once. The floating assistant then mounts on every store you visit.</p>

      <label for="key">Macham API key
        <div class="hint">Your <code>mch_…</code> key. It stays in the extension, never on the page.</div>
      </label>
      <input id="key" type="text" autocomplete="off" spellcheck="false" placeholder="mch_live_…" />

      <label for="tenant">Tenant id
        <div class="hint">Scopes usage and the store brain to you.</div>
      </label>
      <input id="tenant" type="text" autocomplete="off" placeholder="my-store" />

      <label for="assist">Gateway URL
        <div class="hint">Where the widget's brain, catalog reads, PayPal, and settlement proof live. Blank = the page's own origin.</div>
      </label>
      <input id="assist" type="text" autocomplete="off" spellcheck="false" placeholder="https://gateway.example.com" />

      <div>
        <button id="save">Save</button>
        <button id="clear" class="ghost">Clear</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
